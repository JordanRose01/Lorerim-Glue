; LoreRim Glue - defaults. Your changes are saved by MCM Helper to MCM\Settings\LoreRimGlue.ini
; (in MO2 that lands in Overwrite) and override these.

[General]
; [0.5.4] THE CANARY. LRG_Main.SettingsLive() reads this key once per load. MCM Helper
; answers 0 for any key it does not have, so 0 here means MCM Helper does not have this
; mod's settings at all - and the scripts then fall back to their own built-in defaults
; for every setting, instead of reading FALSE for bEnabled and switching the whole mod
; off in silence. Deliberately not on any MCM page: nothing the owner presses can zero it.
iSettingsVersion = 506
bEnabled = 1
bKillSwitch = 0
; [pt17] THE DEVELOPER DRY RUN - keep it 0 for play. With 1 every command an NPC tries is refused
; (undress, scenes, follow / wait / release, clicks, services) and only logged as WOULD. It lives at
; the bottom of the Diagnostics page as "DEV: dry-run everything"; while it is on the NPCs say so, a
; message box says so on load and a corner note repeats it every two minutes. Playtest 2026-09-23
; 19:57: the owner switched this one on (it sat on page 1 as "Dry-run mode") when the menuless
; questing dry run was meant, and seven correct requests were refused in silence. It is NOT
; bDlgDryRun below, which only concerns quest talk.
bDryRun = 0
bDebugLog = 1
; [pt15] how much the glue logs. 0 = errors only, 1 = normal (for play: load line, commands,
; results, snapshot problems, voice, errors), 2 = everything (adds conversation-hold, facts,
; initiative, listener, calibration and reply-timing chatter, and copies every line to the
; Papyrus log). LRG_Main caches it at load and re-reads it every 30 s on the heartbeat.
iLogLevel = 1
bNotifyErrors = 1
; [0.5.4] the corner note on load ("LoreRim Glue v504 loaded - session NNNN"). It is the
; only proof of life that needs neither CHIM, nor MCM Helper, nor the server, so leave it
; on unless the glue is known to be healthy. Defaults to ON in the script as well.
bBootNotify = 1
; [0.5.4] the 30 s heartbeat that keeps this quest timer alive and re-asserts the CHIM
; mod-event and crosshair registrations every two minutes. Turning it off restores the
; 0.5.3 behaviour, in which one bad load left the whole mod inert until the next one.
bHeartbeat = 1

[Intimacy]
bIntimacyEnabled = 1
fWitnessRadiusInterior = 1200
fWitnessRadiusExterior = 2500
iDefaultLead = 0
iNavigationReach = 5
bAllowWarp = 1
bFurniture = 1
fFurnitureRadius = 1200
bRedressAfter = 1
bRefuseIfArmed = 1
bFixOStimWeaponCrash = 1
bGlueUndressMidScene = 1
bAnnounceWait = 1
bForceListener = 1
; v0.3.1: how long a second request from the same sentence ("take my clothes off and then lie
; down") may wait for the first one to finish. 0 = never wait (0.3 behaviour).
; 30, not 20: the game gives a navigation 25 s of its own (GoToScene) and a start waits for her
; spoken line on top, so a 20 s budget gave up on the second half while the first half was still
; legitimately running. The script also holds the queue open past this deadline (up to twice it)
; for as long as the first command is demonstrably still in flight.
fQueueWait = 30
; v0.4 "everyone has a price": paying for intimacy. Septims only ever move when SHE accepts a price
; in conversation, and nothing is refunded if you stop early. 0 removes the whole mechanism.
bPaidIntimacy = 1
fPriceMultiplier = 1.0
; v0.4 - a closed door makes a room private (owner complaint 2). Until 0.4 the witness scan counted
; every awake adult inside fHearRadius with NO line-of-sight test at all, so a room in an occupied
; inn could never reach zero witnesses whatever door was shut. Seen is still seen: an open doorway,
; a shared room or a balcony above still counts. bPrivacyDoors = 0 restores the old behaviour.
; A MISSING key here reads as 0, which would switch the whole fix off - keep these three lines.
bPrivacyDoors = 1
fHearRadius = 600
fDoorRadius = 250

[Initiative]
bInitiative = 1
fInitiativeInterval = 90

; v0.4.1 THE CONVERSATION HOLD (owner addendum 8). While a CHIM conversation with an NPC is live she
; stops and faces you instead of walking back to her schedule. She is released by the window below,
; by distance, by you sneaking off, by combat, by a real dialogue menu, by a scene, by another cell,
; by an arrest, by a quest taking her over, by the stop hotkey, by the kill switch and by a game
; load - and by a self-heal at three windows plus 30 s, so she can never be left frozen.
; A MISSING key here reads as 0/FALSE, which for bConvHold and fConvHoldWindow means the feature is
; simply OFF (the fOutroHold scar) and for fConvHoldFar would release her instantly - which is why
; every key of this section has a line, the zero included, and the in-code default equals the line.
[Conversation]
bConvHold = 1
fConvHoldWindow = 45
fConvHoldFar = 900
; The opt-in second layer. It suspends her AI package as well as her feet, which is stronger against
; a busy AI Overhaul / Jobs Overhaul routine but writes a package override into the save for the
; length of the hold. Leave it at 0 unless playtesting shows her struggling against her package.
bConvHoldPackage = 0

[SceneTalk]
bSceneTalk = 1
iSceneTalkChance = 35
fSceneTalkGap = 25
fSceneLeadInterval = 75
iExplicitness = 2
fLeadHold = 150
fSayFirstWait = 6
fSayFirstMaxWait = 20
fSayFirstSettle = 1
; v0.3.1 - the goodbye after a scene. fOutroHold = 0 switches the whole thing off and a scene ends
; exactly as it did in 0.3. A MISSING key here reads as 0, which is why fOutroFar falls back to its
; default in code instead of releasing her instantly.
; This is the budget for her goodbye to BEGIN, not a guillotine: while she is audibly speaking the
; game keeps extending it in 5 s steps (bounded by the script's own self-heal at twice the budget
; plus 30 s), so the timeout can no longer cut across her last words. Raise it here or in the MCM
; if her voice regularly takes longer than this to arrive at all.
fOutroHold = 25
fOutroSettle = 2.5
; NOTE (not a bug): this is the threshold for the GOODBYE and matches the server's outro ticket
; (min_scene_seconds 45). The server's relationship gain for a completed scene has its own, higher
; threshold (60 s), so a scene of 45-59 s gives a goodbye but no affinity gain. Two thresholds for
; two different things, deliberately.
fOutroMinScene = 45
fOutroFar = 1500
; v0.4 - who you are talking to after a scene (owner complaint 1, "it leaves u in the ostim director
; mode"). The scene used to end by handing CHIM's routing back on the spot, and right then there is
; nobody under the crosshair - so CHIM answered as the Narrator and she never heard a word of it
; (playtest 8: three times in thirteen minutes, every line naming her). She now stays the listener
; for fListenerHold after the scene, plus the goodbye window on top, and for as long as either of you
; keeps talking. Worst case 2 x fListenerHold + fOutroHold + 30 s = 95 s at these defaults.
; fListenerHold = 0 switches it off. A MISSING key reads as 0, i.e. off - keep these lines.
fListenerHold = 20
fListenerGrace = 2.5
; ... and if a scene ever leaves the camera or the controls with OStim, put them back. It only fires
; on real evidence (free camera, or movement / look controls off) and logs every time it does.
bFixControlsAfterScene = 1

[Survival]
bColdExempt = 1
fColdRestore = 10

[Keys]
; 207 = End. PROTOCOL rests the non-adult and the blocked-scene case on "the stop hotkey stays",
; so it must actually be bound out of the box. End is free in vanilla Skyrim, in every LoreRim MCM
; that saves a hotkey, and among OStim's own keys (numpad + arrow keys). Rebind or clear it here or
; in the MCM if it clashes with something.
iKeyStopScene = 207
iKeyDumpTopics = 0
; v0.4 menuless questing. iKeyLeave ends the business politely (the same path the NPC's own
; "never mind" takes). [v1.0] The probe key and the emergency "open vanilla dialogue" key are
; retired: the dialogue list is never taken away, so there is nothing to escape from.
iKeyLeave = 0

; ---------------------------------------------------------------------------
; MENULESS QUESTING v1.0 - THE VISIBLE MENU, VOICE-DRIVEN (spec pt19).
; bMenuless = 1 (the default): her real dialogue list is on screen and stays there; the player never
; has to click it - his words name a line and the glue clicks it for him - and he may click it by
; hand at any moment. It learns the four things it reads from the first dialogue menu of any kind
; (the Calibration page); until then a click is refused with "still learning the dialogue menu".
; bDlgDryRun = 1 reads and decides but clicks nothing (the log says WOULD CLICK). [v1.0] It ships
; 0 and is never forced on or cleared by the game; it is the owner's own toggle.
; bMenuless = 0 means: nothing is ever clicked and no conversation is ever opened by the glue -
; every dialogue stays a normal, visible, clickable menu whose topic list is still read and sent.
; A MISSING key here reads as 0/FALSE (the scar at fOutroHold above), so every key of these
; sections has a line, the zeroes included, and the in-code default equals the line.
; ---------------------------------------------------------------------------
[Dialogue]
bMenuless = 1
bDlgDryRun = 0
; bDlgWire = 0 stops EVERY lrg_dlg / lrg_topics / lrg_dlgtalk message leaving the game. It is the
; one-toggle rollback for a server that is still on 0.3.1, where those types would be answered as
; ordinary paid LLM turns with the raw payload read aloud. The two halves of 0.4 ship together,
; server first; leave this at 1 with a 0.4 server.
bDlgWire = 1
; [v1.0] bAutoAdvance = 1: a single effect-free line (the oath lines) plays by itself a short breath
; after the line before it has gone from the screen, unless the talk key (iKeyPushToTalk) is pressed.
bAutoAdvance = 1
; [v1.0] iCritical is retired, with bCrimeManual ([Services]): a guard who has something against you
; is never driven and nothing on her list is picked by voice, at any setting (spec pt19 S1.1 / S4.9),
; so neither switch could change anything.
; [v1.0] iSceneGate is the MCM enum's 0-based value: 1 = "Unless a journal quest owns it" (the
; default: a scene whose owning quest has an unfinished objective in the journal is never
; interrupted by an open), 0 = never open anybody who is inside any scene.
iSceneGate = 1
; [v1.0] bDriveSceneMenus = 1: a conversation the ENGINE opens inside a journal-quest scene is driven
; by voice as well - but only once the click route is proven by a real click on this install
; (the Calibration page says "route proven"). No MCM control on purpose; the server's own kill
; switch is dialogue.session.drive_scene. A MISSING key reads as 0 = such scenes stay the player's.
bDriveSceneMenus = 1
; [v1.0] iKeyPushToTalk: the key the player holds to talk to CHIM (29 = Left Ctrl, CHIM's key on
; this install). It only tells the glue he is about to speak, so a line that would carry on by
; itself waits instead. 0 = off.
iKeyPushToTalk = 29
fDecideTimeout = 4
fLineSettle = 0.4
fOpenDistance = 200
iClickRoute = 0
iReadMode = 0
iCountMode = 0
; v0.5: 0 now means "as many as this machine can afford", worked out from what the calibration
; measured while you played. Any other number is yours and wins.
iMaxEntries = 0
; [v1.0] 16, not 40: the texts-only pass beyond the full read, bounded so one changed layer costs at
; most 48 UI reads (head 16 x 2 + tail 16).
iTailMax = 16
bIntentOpen = 1
bAllowNullVoice = 0
bActivateDefaultOnly = 0

[Checks]
bFreeChecks = 1
iCheckBias = 0
bCheckStats = 0
bCheckHostility = 0

[Quests]
bQuestAware = 1
iQuestLines = 3
; v0.5 E2 - quest awareness v2. These only change what she is ABLE to answer; a MISSING key reads
; as 0 = off, which is why every key here has a line. [v1.0] The opt-in "she may bring it up
; herself" pair is retired with the server's quest-initiative block (spec pt19 section 4 / S9).
bQuestHint = 1
bQuestSummary = 1
bQuestNext = 1
; [pt19 / script 511] QUIET MODE: the glue stands aside while a curated scripted intro runs (MQ101 - Helgen's
; Unbound - from stage 5; the list is QUIET_QUESTS in LRG_Main.psc). Ships ON; a MISSING key reads as 0 = off.
bQuietIntro = 1

; ---------------------------------------------------------------------------
; v0.5 E6 / E7 (owner addendum item 9) - services and truth.
; Services: rooms, carriages, ferries, training, trade and crime dialogue are handled through the
; NPC's REAL entry when she has one, with LoreRim's real prices, and CHIM's own shortcut steps
; aside. An arrest is never picked for you: while a guard who has something against you is talking
; to you, her list stays on screen and nothing on it is picked for you, at any setting (no switch).
; Truth: prices, fares, bounties and check outcomes are handed to her as FACTS, and a number the
; game has not confirmed may not spend your septims.
; ---------------------------------------------------------------------------
[Services]
bServiceDialogue = 1
bServiceShortcut = 1
bCarriageByName = 1
bNamePrices = 1

[Truth]
bLockedFacts = 1
bTruthGate = 1

; ---------------------------------------------------------------------------
; v0.5 E8 - latency. One line per reply in lorerim_glue.log: how long you waited for her words,
; and how long again before her VOICE started. Nothing is sent to the AI and nothing is measured
; twice. iLatencyWarnMs is in milliseconds; a MISSING key reads as 0, which is why the script
; falls back to 9000 rather than warning on every single reply.
; ---------------------------------------------------------------------------
[Diagnostics]
bLatencyLog = 1
iLatencyWarnMs = 9000

; ---------------------------------------------------------------------------
; v0.5.1 - FOLLOWERS (owner addendum 10). This modlist's follower framework is Simple Follower
; Framework, not NFF, and CHIM's own "join my party" cannot finish a recruit here: it leaves the
; NPC half-recruited, which is what makes "it's time we parted ways" dismiss the WRONG follower.
; A MISSING key reads as 0/FALSE, so every key has a line, the zeroes included - and with
; bFollowerAware = 0 the game sends nothing about followers at all, i.e. exactly the 0.5.0 wire.
; iFollowerRepairMode: 0 = make her a real follower when a slot is free, otherwise undo CHIM's
; edit; 1 = always undo it; 2 = only write it in the log and change nothing.
; ---------------------------------------------------------------------------
[Followers]
bFollowerAware = 1
bFollowerRepair = 1
iFollowerRepairMode = 0
bFollowerVerbsReal = 1
bFollowerHoldSkip = 1
; [0.5.6] ExtCmdLRG_Escort: "follow me" may end the performance / idle scene that holds her
; (never a quest in the journal, a main / faction / courier quest). 0 = she stays in her scene.
bEscortStopScene = 1
; [pt16] The natural follow: the glue lays its own follow package (LoreRimGlue.esp 0x803, the game's
; own follower distances 128 / 256 units, no line-of-sight rule) over CHIM's follow (512 / 1024 with
; LOS - the sprint-and-stop). Covers the escort's follow and a follow CHIM started by itself.
; 0 = CHIM's follow exactly as it is. A MISSING key reads as 0, so this line is mandatory.
bNaturalFollow = 1
; [pt17] "Follow me" hands her to Simple Follower Framework: she becomes your real companion (the same
; recruit its own "Follow me, I need your help" line makes) when the framework can take her - a free
; slot (one per 25 Speech at the shipped SFF ini), someone the game lets you recruit, not a hireling -
; and its own follow package, wait and (as a wait) "you can go" apply; otherwise she walks with you the
; old way (CHIM's follow + the natural follow above) and SAYS why. Any follow of CHIM's found on a real
; companion is taken off her. 0 = the old way for everyone. A MISSING key reads as 0.
bSffFollow = 1
