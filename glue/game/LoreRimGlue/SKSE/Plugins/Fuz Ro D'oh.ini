; ===========================================================================
; LoreRim Glue override.  Source: mod "LoreRim - MCM and INI Settings",
;   SKSE\Plugins\Fuz Ro D'oh.ini (58 bytes, modlist.txt line 145).  The mod
;   "Fuz Ro D-oh - Silent Voice" (line 3682) ships no ini of its own, so
;   LoreRim's is the copy the game loads today.  One value changed:
;       [General]  WordsPerSecondSilence   2 -> 3
;   SkipEmptyResponses is left at 1.
; Why: this is how long the game freezes you on an unvoiced line - the line's
;   word count divided by this number, in seconds.  At 2 words/second a long
;   unvoiced line holds you for up to ten seconds; at 3 it is a third shorter.
;   Every line the AI speaks that has no audio yet goes through this.
; The comment block sits ABOVE [General] on purpose: Fuz Ro D'oh uses
;   WritePrivateProfileSectionA, which replaces the whole of a section it
;   rewrites, and anything before the first section header survives that.
; To undo: delete this file from the "LoreRim Glue" mod folder.
; ===========================================================================
[General]
WordsPerSecondSilence=3
SkipEmptyResponses=1
