##############################################################################
# LoreRim Glue override of  CBPC - Physics with Collisions for SSE and VR\SKSE\Plugins\CBPCSystem.ini
#
# This is a verbatim copy of CBPC's own file. As of 2026-09-23 (pt15, performance) NO value differs
# from CBPC's: Logging is back to 0. It was 1 for the pt8 bounce verification only, and in one
# 25-minute session it wrote a 710 MB CBPC-Collision.log - per-node detail on every physics frame.
# The file is kept (rather than deleted) so the register in OVERRIDES.md stays true and the next
# knob below is one edit away.
#
# HISTORY - pt8 changed exactly one value:  Logging = 0   ->   Logging = 1
#
# WHY: with logging off, CBPC-Collision.log only records that config files loaded. It says
# nothing about which bones are actually being driven on which actor, so there was no way to
# prove whether the breast chain was moving. With it on, CBPC writes per-node detail to
#     C:\Users\Jordan\Documents\My Games\Skyrim Special Edition\SKSE\CBPC-Collision.log
# which settles it in one minute of play.
#
# DONE (pt15): back to 0. CBPC's own warning: "This decreases performance, so don't play with
# this on. Also the file generated will be huge if played long."
#
# Everything else is CBPC's own value and is deliberately unchanged, including
# FpsCorrection = 0. (Note for later: the framerate cap was changed 240 -> 60 in
# SSEDisplayTweaks.ini, and with FpsCorrection = 0 the bounce amount varies with framerate.
# If motion still feels weak AFTER the amplitude fix has been confirmed working, setting
# FpsCorrection = 1 here is the next knob to try - one change at a time.)
##############################################################################
# Performance and Haptic Settings
##############################################################################

SkipFrames = 0             #May be increased to 1 or 2(or more) for more performance if your cpu is not up to it. But animation becomes less smooth. And bugs may appear at higher values.

SkipFramesPelvis = 1       #Not used that much and doesn't need too much calculation to be smooth. You can decrease this for smoother animation. Increase it for performance.

GridSize = 25              #This is for spatial hashing algorithm. Don't change this unless you know what you are doing!!!! Lower values cause shakes or collision to fail. Higher values would increase accuracy if there are larger node spheres defined. But performance would decrease a lot.

ActorDistance = 1024       #Actors beyond this distance are ignored for collision.

ActorBounceDistance = 2048 #Actors beyond this distance are ignored for bounce and collisions. I suggest leaving this at 4096. Bounce only is very performant.

ActorAngle = 360           #Actors beyond this angle are ignored. Setting it to 360 disables angle restriction. Setting it to 0 means only player will get physics.

UseCamera = 0              #Use camera position and angle to determine ActorAngle. Set to 0 if you are having issues with free camera etc. with some mods.

FpsCorrection = 0          #FPS correction mode for motions. Makes the bounce movement amount independent of fps, but can appear choppy on low fps. Disabling it would make it smooth even on low fps, but the bounce amount would change with fps.

InCombatActorCount = 20    #Actor count to process in combat, sorted by distance

OutOfCombatActorCount = 40 #Actor count to process out of combat, sorted by distance

Logging = 0	           #LoreRim Glue: CBPC default, restored pt15 (was 1 for the pt8 test). Set this to 1 to enable logging. Path is this: My Documents\My Games\Skyrim VR or Special Edition\SKSE\CBPC-Collision.log This decreases performance, so don't play with this on. Also the file generated will be huge if played long.

#For VR
HapticFrequency = 10       #Vibration frequency multiplier. Between 1 and 3999

HapticStrength = 1         #how many vibration loops. Change this to change vibration strength

DisableSelfHaptics = 1     #Disable self haptics (Player hand to player body) in VR
